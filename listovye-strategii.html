<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3a2c20">
<meta name="mobile-web-app-capable" content="yes">
<title>Листовые стратегии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Neucha&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4edda;--paper2:#ebe2c8;--ink:#1b2f94;--pencil:#3b3a3c;--red:#b01e1e;--line:#a9c0d8;--desk:#3a2c20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--pencil);font-family:Neucha,'Comic Sans MS','Segoe Print',cursive;font-size:17px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:Caveat,Neucha,cursive;font-weight:700;margin:.2em 0;color:var(--ink)}
h1{font-size:44px;line-height:1;transform:rotate(-1.2deg)}h2{font-size:30px}h3{font-size:24px}
button,input,select{font:inherit;color:inherit}
.sheet{background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
#home,#room{position:absolute;inset:0;overflow-y:auto;padding:max(18px,env(safe-area-inset-top)) 16px 30px;display:none;-webkit-overflow-scrolling:touch}
#home::before,#room::before{content:"";position:fixed;left:34px;top:0;bottom:0;width:1.5px;background:#d9534f88;pointer-events:none}
.col{max-width:520px;margin:0 auto;padding-left:26px;position:relative}
.btn{display:inline-block;min-height:46px;padding:8px 16px;background:#fbf6e6cc;border:2px solid var(--ink);color:var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;font-size:19px;cursor:pointer}
.btn:active{transform:translate(1px,1px) rotate(-.4deg);background:#dde5f3}
.btn.red{border-color:var(--red);color:var(--red)}.btn.pencil{border-color:var(--pencil);color:var(--pencil)}
.btn.fill{background:var(--ink);color:#f7f1df}
.btn[disabled]{opacity:.4}
.btn.wide{width:100%;margin:6px 0}
input[type=text],select{width:100%;min-height:46px;padding:6px 10px;background:transparent;border:0;border-bottom:2px solid var(--ink);font-size:20px;color:var(--ink);outline:0;border-radius:0;user-select:text;-webkit-user-select:text}
label{display:block;margin:12px 0 2px;color:#55535a;font-size:15px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}
.item{display:flex;gap:8px;align-items:center;padding:10px 4px;border-bottom:1.5px dashed #8a97b6}
.item small{color:#6b6870;display:block}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:1.5px solid #0005}
.note{color:#6b6870;font-size:15px;line-height:1.3}
#err{position:fixed;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 58px));transform:translateX(-50%) rotate(-.6deg);max-width:88vw;background:#fff4b8;color:#7a1b1b;padding:9px 14px;box-shadow:1px 3px 8px #0006;z-index:50;display:none;text-align:center}
#game{position:absolute;inset:0;display:none;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:absolute;left:0;right:0;top:0;padding:max(4px,env(safe-area-inset-top)) 6px 4px;background:var(--paper);box-shadow:0 2px 7px #0007;z-index:5;border-bottom:1.5px solid #8a7f62}
#turn{font-family:Caveat,Neucha,cursive;font-weight:700;font-size:23px;line-height:1.05;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cx{position:absolute;right:3px;top:max(1px,env(safe-area-inset-top));width:34px;height:30px;background:none;border:0;font-size:20px;color:#b01e1e;padding:0}#turn{padding:0 32px}
#slots{font-size:13px;text-align:center;line-height:1.1;color:#55535a}
#res{display:flex;justify-content:space-between;gap:1px;font-size:13px;margin-top:1px}
#res span{display:flex;align-items:center;gap:2px;white-space:nowrap}#res svg{width:15px;height:15px;flex:none}
#hint{position:absolute;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:6;display:none;background:var(--paper);box-shadow:0 2px 9px #0008;padding:8px 10px;transform:rotate(-.3deg)}
#hint .t{font-size:17px;line-height:1.2}
#hint .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}#hint .btn{min-height:42px;font-size:17px;padding:5px 12px;flex:1;white-space:nowrap}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--paper2);box-shadow:0 -2px 7px #0007;z-index:7;padding-bottom:env(safe-area-inset-bottom);border-top:1.5px solid #8a7f62}
#bar button{flex:1;min-width:0;min-height:60px;background:none;border:0;border-right:1px dashed #9a8f70;font-size:13px;line-height:1.05;padding:3px 1px;color:var(--pencil);position:relative}
#bar button:last-child{border:0}#bar button:active{background:#ddd2b0}
#bar svg{display:block;width:26px;height:26px;margin:0 auto 1px}
#bar button.go{color:var(--ink);font-weight:bold}
#bar .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:9px;min-width:17px;font-size:12px;line-height:17px;font-family:sans-serif}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;z-index:20;padding:10px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .18s;box-shadow:0 -5px 18px #0009;-webkit-overflow-scrolling:touch}
#panel.open{transform:none}
#scrim{position:absolute;inset:0;background:#0005;z-index:15;display:none}#scrim.open{display:block}
.pclose{position:sticky;top:-10px;float:right;background:var(--paper);border:2px solid var(--pencil);border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1;z-index:1}
.cat{margin-top:8px;color:var(--pencil)}
.card{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1.5px dashed #8a97b6;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-height:54px}
.card:active{background:#dde5f3}.card.no{opacity:.45}
.card canvas{width:42px;height:42px;flex:none}
.card b{font-weight:normal;font-size:19px;color:var(--ink);display:block;line-height:1.05}
.card small{color:#666;font-size:14px;line-height:1.15;display:block}
.tab{display:flex;gap:6px;margin:6px 0}.tab .btn{flex:1;padding:4px;min-height:40px;font-size:16px}
#logbox .l{padding:3px 0;border-bottom:1px dotted #aaa;font-size:16px;line-height:1.2;user-select:text;-webkit-user-select:text}
.num{width:64px!important;text-align:center;user-select:text}
#over{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#0007;padding:20px}
#over .box{max-width:420px;width:100%;padding:18px;text-align:center;box-shadow:0 6px 24px #000a;transform:rotate(-1deg)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border:1px solid #7d8bb0;padding:2px 3px;text-align:center}
</style>
</head>
<body>
<div id="home" class="sheet"><div class="col">
  <h1>Листовые стратегии</h1>
  <p class="note">Война на листе в клетку. Один ход — одно действие.</p>
  <label>Ваше имя</label><input type="text" id="nm" maxlength="18" placeholder="Как вас зовут, командир?">
  <h2>Войти к другу</h2>
  <p class="note">Введите код, который вам прислал создатель комнаты.</p>
  <div class="row" style="margin-top:12px"><input type="text" id="jc" class="grow" maxlength="4" placeholder="Код комнаты" style="text-transform:uppercase"><button class="btn" id="jb">Войти</button></div>
  <h2>Новая игра</h2>
  <label>Название</label><input type="text" id="ti" maxlength="18" placeholder="Лист №1">
  <div class="row"><div class="grow"><label>Игроков</label><select id="mp"><option>2<option>3<option selected>4<option>5<option>6</select></div>
  <div class="grow"><label>Карта</label><select id="sz"><option value="s">Малая<option value="m" selected>Средняя<option value="l">Большая</select></div></div>
  <label>Подсчёт налогов, каждые</label><select id="txe"><option value="5">5 раундов<option value="10" selected>10 раундов<option value="15">15 раундов<option value="20">20 раундов<option value="30">30 раундов</select>
  <label>Скорость войск</label><select id="spd"><option value="1" selected>Как в таблицах<option value="2">×2<option value="3">×3</select>
  <label>Время на ход</label><select id="tm"><option value="0">Без ограничения<option value="60">1 минута<option value="120" selected>2 минуты<option value="300">5 минут<option value="86400">Сутки</select>
  <button class="btn fill wide" id="cb" style="margin-top:14px">Создать комнату</button>
  <div style="margin-top:14px"><button class="btn pencil wide" data-rules>Правила игры</button></div>
</div></div>

<div id="room" class="sheet"><div class="col">
  <h2 id="rt"></h2>
  <p>Код комнаты: <b id="rc" style="font-size:28px;color:var(--red);letter-spacing:2px"></b></p>
  <button class="btn wide" id="sh">Пригласить друзей</button>
  <div id="plist"></div>
  <p class="note" id="rn"></p>
  <div id="hostbtns"><button class="btn pencil wide" id="ab">Добавить бота</button><button class="btn fill wide" id="st">Начать игру</button></div>
  <button class="btn red wide" id="lv">Выйти из комнаты</button>
</div></div>

<div id="game">
  <canvas id="c"></canvas>
  <div id="top" class="sheet"><button id="cx" aria-label="Отменить игру">✕</button><div id="turn"></div><div id="res"></div><div id="slots"></div></div>
  <div id="hint"><div class="t"></div><div class="acts"></div></div>
  <div id="bar">
    <button data-p="build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V9l8-5 8 5v12zM9 21v-7h6v7"/></svg>Строить</button>
    <button data-p="army"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16l8-9 8 9M4 21l8-9 8 9"/></svg>Войска</button>
    <button data-p="sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 3h16v18H4zM4 8h16M9 8v13M4 13h16M4 17h16"/></svg>Казна</button>
    <button data-p="diplo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l5-5 4 3 4-3 5 5-8 8zM8 7l4 5"/></svg>Союзы<span class="badge" id="bdg" style="display:none"></span></button>
    <button data-p="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/></svg>Журнал</button>
    <button data-p="pass" class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h15M13 6l6 6-6 6"/></svg>Конец хода</button>
  </div>
  <div id="scrim"></div>
  <div id="panel" class="sheet"></div>
  <div id="over"><div class="box sheet"><h1 id="ot"></h1><p id="om"></p><button class="btn fill wide" id="oh">В лобби</button><button class="btn pencil wide" id="ol">Посмотреть карту</button></div></div>
</div>
<div id="rules" class="sheet" style="position:fixed;inset:0;z-index:40;display:none;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px"></div>
<div id="err"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>

function doUpgrade(r,p,a){

const useBuildCheck=r=>{if(r.built)fail('Постройка за этот ход уже сделана')};
function useBuild(r){if(r.built)fail('Постройка за этот ход уже сделана');r.built=true}
function carrySlot(c,u){const m=UNITS[c.kind].carry,g=UNITS[u.kind].dom==='air'?'air':UNITS[u.kind].grp;if(!m||!m[g])return false;const cargo=c.cargo||[];if(cargo.some(x=>(UNITS[x.kind].dom==='air'?'air':UNITS[x.kind].grp)!==g))return false;return cargo.length<m[g]}
function boards(r,u){if(u.cargo&&u.cargo.length)return [];const cells=new Set(reach(r,u).map(c=>key(c[0],c[1])));return r.ents.filter(c=>c.owner===u.owner&&c.id!==u.id&&UNITS[c.kind]&&UNITS[c.kind].carry&&carrySlot(c,u)&&(N8.some(([a,b])=>key(c.x+a,c.y+b)===key(u.x,u.y)||cells.has(key(c.x+a,c.y+b))))).map(c=>c.id)}
function unloadCells(r,c){if(!(c.cargo||[]).length)return [];const dom=UNITS[c.cargo[c.cargo.length-1].kind].dom;return N8.map(([a,b])=>[c.x+a,c.y+b]).filter(([x,y])=>inb(r,x,y)&&!entAt(r,x,y)&&!inRad(r,x,y)&&(dom==='air'||!isWater(r,x,y)||key(x,y) in r.roads))}
function dropCells(r,u){
 const s=UNITS[u.kind];if(!r.players[u.owner].techs.includes('drop')||(s.grp!=='inf'&&s.grp!=='veh'))return [];
 const cs=r.ents.filter(e=>e.owner===u.owner&&e.kind==='dropc'&&powered(r,e));
 const from=cs.filter(e=>Math.max(Math.abs(e.x-u.x),Math.abs(e.y-u.y))<=1);if(!from.length)return [];
 const out=[];for(const c of cs)if(!from.includes(c))for(const [a,b] of N8){const x=c.x+a,y=c.y+b;if(inb(r,x,y)&&!entAt(r,x,y)&&!isWater(r,x,y)&&!inRad(r,x,y))out.push([x,y])}
 return out;
}
function doTrade(pl,a){
 const k=a.res,n=a.n;
 if(!isInt(n)||n<=0||n>999)fail('Неверное количество');
 if(a.dir==='sell'&&typeof k==='string'&&SELL[k]){if(pl.res[k]<n)fail('Столько нет');pl.res[k]-=n;pl.res.zakup+=SELL[k]*n}
 else if(a.dir==='buy'&&typeof k==='string'&&BUY[k]){if(pl.res.zakup<BUY[k]*n)fail('Не хватает закупов');pl.res.zakup-=BUY[k]*n;pl.res[k]+=n}
 else fail('Этот ресурс так не торгуется');
}
function placeOk(r,x,y){
 if(!isInt(x)||!isInt(y))return false;
 if(x<2||y<2||x>=r.w-3||y>=r.h-3)return false;
 for(const [a,b] of [[0,0],[1,0],[0,1],[1,1]])if(!landOk(r,x+a,y+b)||nodeAt(r,x+a,y+b))return false;
 return r.ents.every(e=>e.kind!=='hq'||hyp(e.x-x,e.y-y)>=r.hqd);
}
const placeCells=r=>{const o=[];for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++)if(placeOk(r,x,y))o.push([x,y]);return o};
// На тесной карте требование к расстоянию между штабами ослабляется, чтобы место нашлось всегда.
function updateHqd(r){for(const d of [Math.min(MIN_HQ_DIST,r.w>>1),10,5,0]){r.hqd=d;if(placeCells(r).length)return}}
function options(r,p,a){
 if('unit' in a){const u=getEnt(r,a.unit);if(u.owner!==p||!isUnit(u))return {moves:[],targets:[]};
  const m=canMoveNow(r,u);
  return {moves:m?reach(r,u):[],targets:canAttackNow(r,u)?targets(r,u):[],boards:m?boards(r,u):[],drops:m?dropCells(r,u):[],unload:m?unloadCells(r,u):[],full:!slotOk(r,u)}}
 if('ent' in a){const e=getEnt(r,a.ent);return {upgrades:e.owner===p?upgradesOf(r,e):[]}}
 if(a.kind==='place')return {cells:placeCells(r)};
 if(typeof a.kind!=='string'||(a.kind!=='road'&&!specOf(a.kind)))fail('Нельзя построить');
 return {cells:buildCells(r,p,a.kind)};
}

/* Бот */
function landField(r,enemies,p){
 const dist=new Map(),q=[];for(const e of enemies){dist.set(key(e.x,e.y),0);q.push([e.x,e.y])}
 for(let i=0;i<q.length;i++){const [x,y]=q[i],d=dist.get(key(x,y));for(const [dx,dy] of N8){const a=x+dx,b=y+dy,k=key(a,b);if(!inb(r,a,b)||dist.has(k)||(isWater(r,a,b)&&!(k in r.roads)))continue;const o=entAt(r,a,b);if(o&&!allied(r,o.owner,p))continue;dist.set(k,d+1);q.push([a,b])}}
 return dist;
}
function botMove(r,p){
 const pl=r.players[p];
 if(r.status==='place'){const c=pick(placeCells(r));return {type:'place',x:c[0],y:c[1]}}
 const mine=r.ents.filter(e=>e.owner===p),units=mine.filter(isUnit);
 for(const u of units){if(!canAttackNow(r,u))continue;const ts=targets(r,u);if(ts.length){const rank=e=>e.kind==='hq'?0:isStruct(e)?1:2;ts.sort((a,b)=>rank(getEnt(r,a))-rank(getEnt(r,b))||getEnt(r,a).hp-getEnt(r,b).hp);return {type:'attack',id:u.id,target:ts[0]}}}
 const hq=hqOf(r,p);
 if(hq&&!r.built){
  const count=k=>mine.filter(e=>e.kind===k).length;
  // Боту нужны деньги на армию: продаёт золото и бензин.
  for(const k of ['gold','gas'])if(pl.res[k]>0&&pl.res.zakup<40)doTrade(pl,{res:k,n:pl.res[k],dir:'sell'});
  const afford=k=>canPay(pl,costOf(r,p,k));
  const near=k=>{const cells=buildCells(r,p,k);if(!cells.length)return null;let b=null,bd=1e9;for(const c of cells){const d=hyp(c[0]-hq.x,c[1]-hq.y)+Math.random()*2;if(d<bd){bd=d;b=c}}return {type:'build',kind:k,x:b[0],y:b[1]}};
  for(const [k,ok] of [['barracks',!count('barracks')],['extractor',count('extractor')<5],['artworks',!count('artworks')&&count('barracks')]])
   if(ok&&afford(k)){const m=near(k);if(m)return m}
  const net=roadNetwork(r,p);
  for(const e of mine)if(e.kind==='extractor'&&!extractorLinked(r,e,net)){
   const src=roadSources(r,p).filter(c=>c[0]!==e.x||c[1]!==e.y);
   for(const [dx,dy] of N8){const a=e.x+dx,b=e.y+dy,cells=inb(r,a,b)?roadLine(r,p,a,b,src):null;if(cells)return {type:'road',x:a,y:b}}
  }
  for(const k of shuffle(['smert','gun88','mg','spec','sniper','moto','sapper']))if(afford(k)&&units.length<14&&Math.random()<.6){const m=near(k);if(m)return m}
 }
 const enemies=r.ents.filter(e=>!allied(r,e.owner,p));
 const dist=landField(r,enemies,p);
 for(const u of shuffle(units.filter(u=>UNITS[u.kind].mv>0&&canMoveNow(r,u)))){
  const opts=reach(r,u);if(!opts.length||!enemies.length)continue;
  let tgt=enemies[0];for(const e of enemies)if(hyp(e.x-u.x,e.y-u.y)<hyp(tgt.x-u.x,tgt.y-u.y))tgt=e;
  const val=(x,y)=>{const d=dist.get(key(x,y));return d===undefined?1e6+hyp(x-tgt.x,y-tgt.y):d};
  let c=opts[0];for(const o of opts)if(val(o[0],o[1])<val(c[0],c[1]))c=o;
  if(val(c[0],c[1])<val(u.x,u.y))return {type:'move',id:u.id,x:c[0],y:c[1]};
 }
 return {type:'pass'};
}
setInterval(()=>{
 const r=R;if(!r||(r.status!=='place'&&r.status!=='play'))return;
 const pl=r.players[r.turn],now=Date.now();
 if(pl.bot&&now>=(r.botat||0)){
  try{doAction(r,r.turn,botMove(r,r.turn));if(r.players[r.turn]===pl)r.botat=now+350}catch(e){console.warn('bot',e);if(r.status==='play')nextTurn(r);else r.turn=(r.turn+1)%r.players.length}
  touch(r);
 }else if(r.deadline&&now>r.deadline){
  if(r.status==='place'){const c=pick(placeCells(r));doAction(r,r.turn,{type:'place',x:c[0],y:c[1]})}
  else{log(r,`Время хода игрока ${pl.name} вышло.`,r.turn);nextTurn(r)}
  touch(r);
 }
},250);

/* Лобби */
const cleanName=(s,d)=>String(s||'').split(/\s+/).filter(Boolean).join(' ').slice(0,18)||d;
const newToken=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
function addPlayer(r,name,bot=false){const token=newToken();r.players.push({name,token,color:COLORS[r.players.length],bot,alive:true,res:Object.assign({},START_RES),techs:[]});return token}
function syncIdx(r){r.host=r.players.findIndex(x=>x.token===r.hostToken);r.players.forEach((x,i)=>x.color=COLORS[i])}
function create(a){
 const name=cleanName(a.name,'Игрок'),al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 const code=Array.from(crypto.getRandomValues(new Uint8Array(4)),b=>al[b%al.length]).join('');
 R={code,title:cleanName(a.title,'Лист '+name),maxp:[2,3,4,5,6].includes(a.maxp)?a.maxp:4,timer:[0,60,120,300,86400].includes(a.timer)?a.timer:0,size:SIZES[a.size]?a.size:'m',speed:[1,2,3].includes(a.speed)?a.speed:1,taxEvery:[5,10,15,20,30].includes(a.taxEvery)?a.taxEvery:10,built:false,acted:{},status:'lobby',players:[],host:0,rad:[],ents:[],ruins:[],log:[],alliances:[],proposals:[],seq:0,ver:1,turn:0,round:0,touched:Date.now(),roads:{},nodes:[],terrain:[],rivers:[],lakes:[],w:0,h:0,winners:null,deadline:null,fx:null,seed:1};
 const token=addPlayer(R,name);R.hostToken=token;save(true);
 return {code,token,host:true};
}
function route(path,a){
 const r=R;if(!r||String(a.code||'').toUpperCase()!==r.code)fail('Комната не найдена');
 if(path==='/api/join'){
  if(r.status!=='lobby')fail('Игра в этой комнате уже началась');
  if(r.players.length>=r.maxp)fail('Комната заполнена');
  const token=addPlayer(r,cleanName(a.name,'Игрок'));touch(r);return {code:r.code,token};
 }
 const p=r.players.findIndex(x=>x.token===a.token);if(p<0)fail('Вы не в этой комнате');
 if(path==='/api/options')return options(r,p,a);
 if(path==='/api/lobby'){
  if(r.status!=='lobby')fail('Игра уже идёт');
  const t=a.type;
  if(t==='leave'){r.players.splice(p,1);syncIdx(r);touch(r);return {ok:true}}
  if(p!==r.host)fail('Это может только создатель комнаты');
  if(t==='bot'){
   if(r.players.length>=r.maxp)fail('Комната заполнена');
   const free=['Генерал Клякса','Маршал Ластик','Полковник Скрепка','Майор Циркуль','Адмирал Линейка'].filter(n=>!r.players.some(x=>x.name===n));
   addPlayer(r,free[0]||'Бот',true);
  }else if(t==='kick'){
   if(!isInt(a.i)||a.i===r.host||a.i<0||a.i>=r.players.length)fail('Нельзя');
   r.players.splice(a.i,1);syncIdx(r);
  }else if(t==='start'){
   if(r.players.length<2)fail('Нужно минимум 2 игрока (можно добавить бота)');
   shuffle(r.players);syncIdx(r);genMap(r);updateHqd(r);r.status='place';r.turn=0;armTimer(r);
   log(r,'Карта нарисована. Игроки по очереди ставят главный штаб.',null,'win');
  }else fail('Неизвестно');
  touch(r);return {ok:true};
 }
 if(path==='/api/act'){doAction(r,p,a);touch(r);return {ok:true}}
 fail('Неизвестно');
}
function view(token,online){
 const r=R,you=r.players.findIndex(p=>p.token===token);if(you<0)return null;
 const out=JSON.parse(JSON.stringify(r));delete out.hostToken;delete out.botat;delete out.touched;
 out.players=r.players.map((p,i)=>{const q=JSON.parse(JSON.stringify(p));delete q.token;
  // чужие ресурсы скрыты, как на отдельном листе государства, но видны союзникам
  if(!allied(r,i,you)&&r.status!=='over')q.res=null;
  q.online=p.bot||p.token===r.hostToken||online.has(p.token);return q});
 out.you=you;out.left=r.deadline?Math.max(0,Math.floor((r.deadline-Date.now())/1000)):null;
 if(r.status==='play'){out.off=r.ents.filter(e=>e.kind==='extractor'?!extractorLinked(r,e):!powered(r,e)).map(e=>e.id);const pw=powerInfo(r,you);out.power={supply:pw.supply,demand:pw.demand};out.points=pointsOf(r,you)}
 return out;
}
return {create,route,view,
 get room(){return R},
 set onChange(f){onChange=f},
 meta:()=>JSON.parse(JSON.stringify({units:UNITS,buildings:BUILDINGS,techs:TECHS,upg:UPG,sell:SELL,buy:BUY,res:RES_NAMES,x:0})),
 restore(code){try{const r=JSON.parse(localStorage.getItem(SAVE_KEY));if(r&&r.code===code){R=r;return true}}catch(e){}return false},
 close(){R=null;save(true)},
 _test:{doAction,botMove,setRoom:r=>{R=r},addPlayer,route,hqOf,canHit,damage,newEnt,reach,entAt,isUnit,placeCells}};
})();

/* ---------- Сеть: игроки соединяются напрямую с браузером создателя через WebRTC ---------- */
const Net=(()=>{
 const PREFIX='listovye-strategii-v4-';
 let peer=null,conn=null,conns=new Set(),rpcs=new Map(),rid=0,hostCode=null,pushT=null,warned=false,connecting=null,tries=0;
 const noPeer=()=>typeof Peer==='undefined';
 const wrap=(path,body)=>{try{return {ok:true,data:E.route(path,body)}}catch(e){return {ok:false,error:e.message}}};
 const online=()=>new Set([...conns].filter(c=>c.token).map(c=>c.token));
 function pushAll(){
  clearTimeout(pushT);
  pushT=setTimeout(()=>{
   if(!E.room)return;const on=online();
   for(const c of conns)if(c.token){
    const v=E.view(c.token,on);
    try{c.send(v?{t:'state',state:v}:{t:'closed',error:'Создатель убрал вас из комнаты'})}catch(e){}
   }
   if(sess&&sess.host){const v=E.view(sess.token,on);if(v)onState(v)}
  },20);
 }
 E.onChange=pushAll;
 function onGuest(c,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='sub'){
   c.token=String(d.token||'');const v=E.room&&E.view(c.token,online());
   try{c.send(v?{t:'state',state:v}:{t:'closed',error:'Вы не в этой комнате'})}catch(e){}
   pushAll();
  }else if(d.t==='rpc'&&d.body&&typeof d.body==='object'){
   const res=wrap(String(d.path),d.body);
   try{c.send(Object.assign({t:'res',id:d.id},res))}catch(e){}
  }
 }
 function hostStart(code){
  hostCode=code;
  const go=()=>{
   if(hostCode!==code)return;
   if(noPeer()){toast('Нет интернета: доступна игра только с ботами');return}
   const p=peer=new Peer(PREFIX+code);
   p.on('open',()=>{warned=false});
   p.on('connection',c=>{
    c.on('open',()=>conns.add(c));
    c.on('data',d=>onGuest(c,d));
    c.on('close',()=>{conns.delete(c);pushAll()});
    c.on('error',()=>{});
   });
   p.on('error',e=>{
    if(e.type==='unavailable-id'){p.destroy();setTimeout(go,3000)} // старая вкладка ещё числится за этим кодом
    else if(e.type!=='peer-unavailable'&&!warned){warned=true;toast('Нет связи с сетью: друзья пока не смогут подключиться')}
   });
  };
  go();
 }
 setInterval(()=>{ // телефон мог усыпить страницу или сменить сеть
  if(peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}
 },4000);
 function openPeer(){
  return new Promise((ok,no)=>{
   if(noPeer())return no(new Error('Нужен интернет для игры с друзьями'));
   if(peer&&!peer.destroyed&&peer.open)return ok();
   if(peer)peer.destroy();
   peer=new Peer();
   peer.once('open',()=>ok());
   peer.on('error',e=>{if(e.type==='peer-unavailable'&&connecting)connecting.fail(new Error('Комната не найдена или её создатель не в сети'));else no(new Error('Нет связи с сетью'))});
  });
 }
 async function connect(code){
  await openPeer();
  return new Promise((ok,no)=>{
   const c=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});
   const timer=setTimeout(()=>fin(new Error('Комната не найдена или её создатель не в сети')),15000);
   const fin=e=>{clearTimeout(timer);connecting=null;if(e){try{c.close()}catch(_){}no(e)}else ok()};
   connecting={fail:fin};
   c.on('open',()=>{conn=c;fin()});
   c.on('data',onHostMsg);
   c.on('close',()=>{if(conn===c){conn=null;for(const [,x] of rpcs)x.no(new Error('Связь с создателем потеряна'));rpcs.clear();if(sess&&!sess.host)guestLoop()}});
   c.on('error',()=>{});
  });
 }
 function onHostMsg(d){
  if(d.t==='state'&&sess)onState(d.state);
  else if(d.t==='res'){const x=rpcs.get(d.id);if(x){rpcs.delete(d.id);d.ok?x.ok(d.data):x.no(new Error(d.error))}}
  else if(d.t==='closed'){toast(d.error);leaveToHome()}
 }
 let looping=false;
 async function guestLoop(){
  if(looping)return;looping=true;tries=0;
  while(sess&&!sess.host){
   try{
    if(!conn||!conn.open)await connect(sess.code);
    conn.send({t:'sub',token:sess.token});break;
   }catch(e){
    tries++;
    if(!S&&tries>=4){toast(e.message);looping=false;leaveToHome();return}
    if(tries===1&&S)toast('Связь потеряна, переподключаюсь…');
    await new Promise(r=>setTimeout(r,3000));
   }
  }
  looping=false;
 }
 function rpc(path,body){
  if(!conn||!conn.open)return Promise.reject(new Error('Нет связи с создателем комнаты'));
  return new Promise((ok,no)=>{const id=++rid;rpcs.set(id,{ok,no});conn.send({t:'rpc',id,path,body});setTimeout(()=>{if(rpcs.delete(id))no(new Error('Создатель не отвечает'))},15000)});
 }
 return {
  async api(path,body){
   if(path==='/api/meta')return E.meta();
   if(path==='/api/create')return E.create(body);
   if(path==='/api/join'){await connect(String(body.code).toUpperCase());return rpc(path,body)}
   if(sess&&sess.host){const r=wrap(path,body);if(!r.ok)throw new Error(r.error);return r.data}
   return rpc(path,body);
  },
  resume(){
   if(sess.host){
    if(!E.room&&!E.restore(sess.code)){toast('Комната не найдена');leaveToHome();return}
    if(hostCode!==sess.code)hostStart(sess.code);
    pushAll();
   }else guestLoop();
  },
  shutdown(){
   const closing=sess&&sess.host;
   hostCode=null;
   if(closing){for(const c of conns){try{c.send({t:'closed',error:'Создатель отменил игру'})}catch(e){}}E.close()}
   const p=peer;peer=null;conn=null;
   // даём сообщению о закрытии уйти до разрыва соединения
   setTimeout(()=>{if(p)p.destroy()},closing?300:0);
   conns=new Set();
  }
 };
})();
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const api=(path,body)=>Net.api(path,body);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let errT;function toast(m){const e=$('err');e.textContent=m;e.style.display='block';clearTimeout(errT);errT=setTimeout(()=>e.style.display='none',3000)}
let META=null,S=null,sess=null,pollId=0;

/* ---------- Навигация и лобби ---------- */
function show(id){for(const s of ['home','room','game'])$(s).style.display=s===id?'block':'none'}
function refreshRooms(){}
const timerName=t=>t>=86400?'сутки на ход':t>=60?(t/60)+' мин. на ход':t+' с';
function myName(){const v=$('nm').value.trim();if(v)store.set('name',v);return v||'Игрок'}
async function join(code){try{const j=await api('/api/join',{code,name:myName()});enter(j)}catch(e){toast(e.message)}}
function enter(j){sess=j;store.set('sess',JSON.stringify(j));S=null;poll()}
function leaveToHome(){Net.shutdown();sess=null;store.del('sess');pollId++;S=null;mapKey=null;base=null;try{history.replaceState(null,'',location.pathname)}catch(e){}$('over').style.display='none';show('home');refreshRooms()}
$('jb').onclick=()=>{const c=$('jc').value.trim().toUpperCase();if(c.length!==4)return toast('Код — 4 символа');join(c)};
$('cb').onclick=async()=>{try{enter(await api('/api/create',{name:myName(),title:$('ti').value,maxp:+$('mp').value,timer:+$('tm').value,size:$('sz').value,speed:+$('spd').value,taxEvery:+$('txe').value}))}catch(e){toast(e.message)}};
$('sh').onclick=async()=>{
  const web=/^https?:/.test(location.protocol),url=web?location.origin+location.pathname+'?room='+S.code:'';
  const text='Заходи в «Листовые стратегии», код комнаты: '+S.code;
  try{ if(navigator.share) await navigator.share(web?{title:'Листовые стратегии',text,url}:{title:'Листовые стратегии',text});
    else {await navigator.clipboard.writeText(web?text+' '+url:text);toast('Приглашение скопировано')} }catch(e){ toast('Код комнаты: '+S.code) }
};
const lobby=(type,x)=>api('/api/lobby',Object.assign({code:sess.code,token:sess.token,type},x)).catch(e=>toast(e.message));
$('ab').onclick=()=>lobby('bot');$('st').onclick=()=>lobby('start');
$('lv').onclick=async()=>{await lobby('leave');leaveToHome()};
function renderRoom(){
  show('room');$('rt').textContent=S.title;$('rc').textContent=S.code;
  const box=$('plist');box.textContent='';
  S.players.forEach((p,i)=>{
    const d=document.createElement('div');d.className='item';
    const dot=document.createElement('span');dot.className='dot';dot.style.background=p.color;
    const n=document.createElement('div');n.className='grow';n.textContent=p.name+(i===S.you?' (вы)':'')+(p.bot?' 🤖':'')+(i===S.host?' ★':'');
    d.append(dot,n);
    if(S.you===S.host&&i!==S.host){const b=document.createElement('button');b.className='btn red';b.textContent='✕';b.onclick=()=>lobby('kick',{i});d.append(b)}
    box.append(d);
  });
  $('rn').textContent=`Мест: ${S.players.length}/${S.maxp}. ${S.you===S.host?'Начните, когда все соберутся. Партия идёт на вашем устройстве: не закрывайте страницу до конца игры.':'Ждём, пока создатель начнёт игру.'}`;
  $('hostbtns').style.display=S.you===S.host?'block':'none';
  $('ab').disabled=S.players.length>=S.maxp;$('st').disabled=S.players.length<2;
}

const poll=()=>Net.resume();
function onState(st){
  const prev=S;S=st;
  if(st.status==='lobby')return renderRoom();
  show('game');
  if(!prev||prev.status==='lobby'||mapKey!==st.code+st.seed){setupMap();}
  const hqOf=s=>s&&s.ents.some(e=>e.owner===s.you&&e.kind==='hq');
  if(prev&&!hqOf(prev)&&hqOf(st)&&st.round<=1)fitView(); // после установки штаба подъезжаем к нему
  leftAt=st.left==null?null:Date.now()+st.left*1000;
  drawInk();updateHud();
  if(prev&&prev.status!=='lobby'&&st.fx&&(!prev.fx||prev.fx.id!==st.fx.id))startFx(st.fx);
  // если очередь ушла, а выбор остался, сбрасываем подсказку
  if(mode&&(!myTurn())&&mode.t!=='inspect')clearMode();
  if(st.status==='place'&&myTurn()&&!mode)startPlace();
  if(st.status==='over')showOver();
  // не перерисовываем панель, пока игрок вводит текст, иначе ввод сотрётся
  const typing=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
  if($('panel').classList.contains('open')&&(panelName==='log'||panelName==='diplo')&&!typing)renderPanel();
  dirty=true;
}
const myTurn=()=>S&&S.turn===S.you&&(S.status==='play'||S.status==='place')&&S.players[S.you].alive;
function act(a){return api('/api/act',Object.assign({code:sess.code,token:sess.token},a)).catch(e=>{toast(e.message);throw e})}
function opts(a){return api('/api/options',Object.assign({code:sess.code,token:sess.token},a))}

/* ---------- Шероховатая бумага и чернила ---------- */
const CELL=30;let mapKey=null,base=null,ink=null,W=0,H=0;
function rngOf(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function noiseTile(size,fn){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const d=g.createImageData(size,size);fn(d.data,size);g.putImageData(d,0,0);return c}
function paperGrain(){
  const r=rngOf(77);
  return noiseTile(256,(px,n)=>{for(let i=0;i<px.length;i+=4){const v=232+r()*23;px[i]=v;px[i+1]=v-5;px[i+2]=v-22;px[i+3]=255}});
}
function inkHoles(){ // мелкие просветы шарика ручки, чтобы линия не была сплошной
  const r=rngOf(5);
  return noiseTile(128,(px)=>{for(let i=0;i<px.length;i+=4){px[i+3]=r()<.1?55+r()*80:r()*16}});
}
const HOLES=inkHoles();

function wobblePts(p,r,amp){ // разбивает ломаную и добавляет дрожь руки
  const o=[];
  for(let i=0;i<p.length-1;i++){
    const [ax,ay]=p[i],[bx,by]=p[i+1],d=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.round(d/(CELL*.3)));
    for(let k=0;k<n;k++){const t=k/n;o.push([ax+(bx-ax)*t+(r()-.5)*amp,ay+(by-ay)*t+(r()-.5)*amp])}
  }
  const l=p[p.length-1];o.push([l[0]+(r()-.5)*amp*.6,l[1]+(r()-.5)*amp*.6]);return o;
}
function pen(g,pts,color,w,r,opt={}){
  // перьевой штрих: переменная толщина, плюс лёгкое растекание по волокнам
  const q=wobblePts(pts,r,opt.amp==null?CELL*.035:opt.amp);
  g.strokeStyle=color;g.lineCap='round';g.lineJoin='round';
  g.globalAlpha=(opt.alpha||1)*.22;g.lineWidth=w*1.9;
  g.beginPath();q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
  let phase=r()*6;
  g.globalAlpha=(opt.alpha||1)*.9;
  for(let i=0;i<q.length-1;i++){
    const e=i/(q.length-1);
    g.lineWidth=w*(.72+.34*Math.sin(phase+i*.7)+(e<.05?.3:0)+(e>.95?.25:0));
    g.beginPath();g.moveTo(q[i][0],q[i][1]);
    const nx=q[i+1];g.quadraticCurveTo(q[i][0],q[i][1],nx[0],nx[1]);g.stroke();
  }
  g.globalAlpha=1;
}
function blot(g,x,y,rad,color,r){g.fillStyle=color;g.globalAlpha=.85;g.beginPath();const n=10;for(let i=0;i<=n;i++){const a=i/n*6.283,k=rad*(.8+r()*.4);i?g.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k):g.moveTo(x+Math.cos(a)*k,y+Math.sin(a)*k)}g.fill();g.globalAlpha=1}
function circlePts(cx,cy,rx,ry,r,n=14){const a0=r()*6,p=[];for(let i=0;i<=n+1;i++){const a=a0+i/n*6.283;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*(ry||rx)])}return p}

function buildBase(){
  const r=rngOf(S.seed);
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle=g.createPattern(paperGrain(),'repeat');g.fillRect(0,0,W,H);
  // неоднородность старой бумаги
  for(let i=0;i<26;i++){
    const x=r()*W,y=r()*H,R=80+r()*280,gr=g.createRadialGradient(x,y,0,x,y,R),dark=r()<.6;
    gr.addColorStop(0,dark?'rgba(150,120,70,.07)':'rgba(255,255,245,.1)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(x-R,y-R,R*2,R*2);
  }
  // волокна
  g.lineWidth=.6;
  for(let i=0;i<W*H/2600;i++){
    const x=r()*W,y=r()*H,a=r()*6.28,l=4+r()*16;
    g.strokeStyle=r()<.5?'rgba(120,95,60,.13)':'rgba(255,255,255,.3)';
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5+r()*3,y+Math.sin(a)*l*.5+r()*3,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  // клетка тетради с неровной типографской линией
  g.lineWidth=1.05;
  for(let x=0;x<=S.w;x++){const a=.22+r()*.2;g.strokeStyle=`rgba(72,120,178,${a})`;g.beginPath();g.moveTo(x*CELL+.5,0);g.lineTo(x*CELL+.5+(r()-.5)*.8,H);g.stroke()}
  for(let y=0;y<=S.h;y++){const a=.22+r()*.2;g.strokeStyle=`rgba(72,120,178,${a})`;g.beginPath();g.moveTo(0,y*CELL+.5);g.lineTo(W,y*CELL+.5+(r()-.5)*.8);g.stroke()}
  // поле и сгиб листа
  g.strokeStyle='rgba(205,60,60,.45)';g.lineWidth=1.6;g.beginPath();g.moveTo(CELL*1.5,0);g.lineTo(CELL*1.5+1,H);g.stroke();
  let fg=g.createLinearGradient(0,H*.5-14,0,H*.5+14);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(.48,'rgba(70,50,30,.1)');fg.addColorStop(.52,'rgba(255,255,255,.2)');fg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=fg;g.fillRect(0,H*.5-14,W,28);
  // кофейное пятно
  const sx=r()*W,sy=r()*H,sR=50+r()*40;
  g.strokeStyle='rgba(120,75,30,.13)';g.lineWidth=6;g.beginPath();g.arc(sx,sy,sR,.4,5.6);g.stroke();
  g.strokeStyle='rgba(120,75,30,.07)';g.lineWidth=14;g.beginPath();g.arc(sx,sy,sR-4,0,6.28);g.stroke();
  drawWater(g,r);
  for(const n of S.nodes)drawNode(g,n,rngOf(n.x*97+n.y*13+3));
  // виньетка: края листа темнеют и пылятся
  const v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(90,60,25,.25)');g.fillStyle=v;g.fillRect(0,0,W,H);
  return c;
}
function drawWater(g,r){
  const blue='#26519e';
  // размытая заливка, как разведённые чернила, с тёмными берегами
  const wc=document.createElement('canvas');wc.width=W;wc.height=H;const w=wc.getContext('2d');
  const smooth=pts=>{let p=pts;for(let k=0;k<3;k++){const o=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}o.push(p[p.length-1]);p=o}return p};
  const path=(ctx,pts)=>{ctx.beginPath();smooth(pts).forEach((p,i)=>{const x=p[0]*CELL,y=p[1]*CELL;i?ctx.lineTo(x,y):ctx.moveTo(x,y)})};
  w.lineCap=w.lineJoin='round';
  for(const a of S.rivers){path(w,a.pts);w.strokeStyle='#000';w.lineWidth=a.w*2*CELL;w.stroke()}
  for(const l of S.lakes){w.beginPath();w.ellipse(l.x*CELL,l.y*CELL,l.rx*CELL,l.ry*CELL,0,0,6.283);w.fillStyle='#000';w.fill()}
  // оба берега получаем вырезая суженный контур
  const bank=document.createElement('canvas');bank.width=W;bank.height=H;const b=bank.getContext('2d');
  b.drawImage(wc,0,0);b.globalCompositeOperation='source-in';b.fillStyle=blue;b.fillRect(0,0,W,H);
  b.globalCompositeOperation='destination-out';b.lineCap=b.lineJoin='round';
  for(const a of S.rivers){path(b,a.pts);b.strokeStyle='#000';b.lineWidth=a.w*2*CELL-3.2;b.stroke()}
  for(const l of S.lakes){b.beginPath();b.ellipse(l.x*CELL,l.y*CELL,l.rx*CELL-1.6,l.ry*CELL-1.6,0,0,6.283);b.fill()}
  const wash=document.createElement('canvas');wash.width=W;wash.height=H;const f=wash.getContext('2d');
  f.drawImage(wc,0,0);f.globalCompositeOperation='source-in';
  const gr=f.createLinearGradient(0,0,W,H);gr.addColorStop(0,'rgba(55,105,175,.3)');gr.addColorStop(.5,'rgba(70,125,190,.2)');gr.addColorStop(1,'rgba(45,95,170,.32)');f.fillStyle=gr;f.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='multiply';g.drawImage(wash,0,0);g.restore();
  // волны-штрихи внутри воды
  const ripples=document.createElement('canvas');ripples.width=W;ripples.height=H;const q=ripples.getContext('2d');
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
    if(S.terrain[y][x]==='~'&&r()<.3){
      const px=(x+r())*CELL,py=(y+r())*CELL;
      pen(q,[[px-6,py],[px-2,py-2],[px+2,py+1],[px+6,py-1]],blue,1,r,{amp:.6,alpha:.5});
    }
  }
  q.globalCompositeOperation='destination-in';q.drawImage(wc,0,0);
  g.drawImage(ripples,0,0);
  g.drawImage(bank,0,0);
}
function drawNode(g,n,r){drawSymbol(g,'r_'+n.t,(n.x+.5)*CELL,(n.y+.5)*CELL,CELL*.68,'#3a3a40',r)}

function tintAtlas(color){
 if(tinted.has(color))return tinted.get(color);
 const c=document.createElement('canvas');c.width=atlasImg.width;c.height=atlasImg.height;const g=c.getContext('2d');
 g.drawImage(atlasImg,0,0);g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,c.width,c.height);tinted.set(color,c);return c;
}
const spriteOf=e=>e.kind==='aes'?(e.sarc?'sarc':'aes'+e.stage):e.kind==='hes'?(e.slits>0?'hesb2':'hesb'):e.kind==='aesruin'?(e.sarc?'sarc':'aes1'):e.kind;
function drawSymbol(g,kind,px,py,scale,color,r){
 const i=ATLAS.idx[kind];
 if(i===undefined){ // постройки без значка в таблицах
  if(kind==='pole'){pen(g,circlePts(px,py,scale*.17,0,r),color,1.8,r,{amp:.2})}
  else if(kind==='r_gas'){drawSymbol(g,'refinery',px,py,scale*.8,color,r)}
  else if(kind==='r_rock'){pen(g,circlePts(px,py,scale*.42,0,r,16),color,Math.max(1.3,scale*.05),r,{amp:.2});g.fillStyle=color;g.globalAlpha=.95;g.fillRect(px-scale*.17,py-scale*.17,scale*.34,scale*.34);g.globalAlpha=1}
  return;
 }
 const S=ATLAS.S,cols=ATLAS.cols,sx=(i%cols)*S,sy=Math.floor(i/cols)*S,img=tintAtlas(color),rot=(r()-.5)*.09;
 g.save();g.translate(px,py);g.rotate(rot);
 g.globalAlpha=.2;g.drawImage(img,sx,sy,S,S,-scale/2-.5,-scale/2+.4,scale+1,scale+1); // растекание чернил
 g.globalAlpha=.95;g.drawImage(img,sx,sy,S,S,-scale/2,-scale/2,scale,scale);
 g.restore();g.globalAlpha=1;
}
function hpTicks(g,e,px,py,color,r){
 if(e.hp>=e.maxhp||e.maxhp>9000)return;
 if(e.maxhp<=8){for(let i=0;i<e.hp;i++){const x=px-CELL*.42+i*3.3;pen(g,[[x,py+CELL*.44],[x+.5,py+CELL*.3]],color,1,r,{amp:.2})}return}
 g.fillStyle=color;g.font=`bold ${CELL*.38}px Caveat,cursive`;g.textAlign='left';g.fillText(e.hp,px-CELL*.46,py+CELL*.48);
}
function drawInk(){
  if(!ink||!S)return;
  const g=ink.getContext('2d');g.clearRect(0,0,W,H);
  // дороги: коричневая линия как на схеме правил; броды как мостики карандашом
  const byOwner={};
  for(const k in S.roads){const o=S.roads[k];(byOwner[o]=byOwner[o]||[]).push(k.split(',').map(Number))}
  for(const o in byOwner){
    const set=new Set(byOwner[o].map(c=>c.join(',')));
    const col=o==='-1'?'#3b3a3c':S.players[o].color,wid=o==='-1'?1.2:3;
    const rn=rngOf(+o+11);
    for(const [x,y] of byOwner[o]){
      const a=[(x+.5)*CELL,(y+.5)*CELL];let lines=0;
      for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]])if(set.has((x+dx)+','+(y+dy))){pen(g,[a,[(x+dx+.5)*CELL,(y+dy+.5)*CELL]],col,wid,rn,{amp:.6,alpha:.8});lines++}
      if(S.terrain[y][x]==='~'){
        pen(g,[[x*CELL+4,y*CELL+6],[x*CELL+CELL-4,y*CELL+6]],col,1,rn,{amp:.4});pen(g,[[x*CELL+4,y*CELL+CELL-6],[x*CELL+CELL-4,y*CELL+CELL-6]],col,1,rn,{amp:.4});
      }else if(!lines)blot(g,a[0],a[1],2,col,rn);
    }
  }
  // следы боёв: зачёркнутые символы
  for(const u of S.ruins){
    const r=rngOf(u.id+5),px=(u.x+.5)*CELL,py=(u.y+.5)*CELL,col=(S.players[u.owner]||{}).color||'#333';
    g.globalAlpha=.55;drawSymbol(g,u.kind==='aes'?'aes1':u.kind==='hes'?'hesb':u.kind==='aesruin'?'aes1':u.kind,px,py,CELL*.9*(specOf(u.kind).size||1),col,r);g.globalAlpha=1;
    for(let i=0;i<4;i++)pen(g,[[px-CELL*.45+r()*5,py-CELL*.42+i*CELL*.25],[px+CELL*.45-r()*5,py-CELL*.3+i*CELL*.25]],'#232326',1.5,r,{amp:1});
  }
  for(const z of S.rad||[]){g.fillStyle='rgba(70,70,70,.3)';g.beginPath();g.arc((z.x+.5)*CELL,(z.y+.5)*CELL,z.r*CELL,0,6.283);g.fill();pen(g,circlePts((z.x+.5)*CELL,(z.y+.5)*CELL,z.r*CELL,0,rngOf(z.src),40),'#55555a',3,rngOf(z.src),{amp:1})}
  const off=new Set(S.off||[]);
  for(const e of S.ents){
    const col=S.players[e.owner].color,r=rngOf(e.id*3+1),sz=(specOf(e.kind).size||1),px=(e.x+sz/2)*CELL,py=(e.y+sz/2)*CELL;
    const scale=CELL*.98*sz;
    if(e.kind==='hq'){g.save();g.fillStyle=col;g.globalAlpha=.1;g.fillRect(e.x*CELL+2,e.y*CELL+2,CELL*2-4,CELL*2-4);g.restore()}
    drawSymbol(g,spriteOf(e),px,py,scale,col,r);
    if(e.kind==='hes'){
      e.ext.forEach((c,i)=>drawSymbol(g,i+1<e.slits?'hesb2':'hesb',(c[0]+.5)*CELL,(c[1]+.5)*CELL,scale,col,r));
      if(e.sensor)drawSymbol(g,'sensor',px-CELL*.42,py,CELL*.4,col,r);
      for(let i=0;i<e.trans;i++)drawSymbol(g,'trans',px+(i%2?.42:-.42)*CELL,py+(i<2?-.48:.48)*CELL,CELL*.42,col,r);
    }
    hpTicks(g,e,px,py,col,r);
    if(e.ammo){blot(g,px+CELL*.38,py+CELL*.38,2.4,col,r)}
    if(e.wireless){pen(g,[[px-CELL*.45,py-CELL*.3],[px-CELL*.32,py-CELL*.44],[px-CELL*.2,py-CELL*.3]],'#1b6fbd',1.3,r,{amp:.2})}
    if(e.cargo&&e.cargo.length){g.fillStyle=col;g.font=`bold ${CELL*.42}px Caveat,cursive`;g.fillText('×'+e.cargo.length,px+CELL*.1,py-CELL*.22)}
    if(off.has(e.id)){pen(g,[[px+CELL*.2,py-CELL*.46],[px+CELL*.44,py-CELL*.2]],'#c02020',1.6,r,{amp:.3});pen(g,[[px+CELL*.44,py-CELL*.46],[px+CELL*.2,py-CELL*.2]],'#c02020',1.6,r,{amp:.3})}
  }
  // зерно: шарик ручки оставляет просветы
  g.save();g.globalCompositeOperation='destination-out';g.fillStyle=g.createPattern(HOLES,'repeat');g.fillRect(0,0,W,H);g.restore();
  dirty=true;
}
function setupMap(){
  mapKey=S.code+S.seed;W=S.w*CELL;H=S.h*CELL;
  base=buildBase();
  ink=document.createElement('canvas');ink.width=W;ink.height=H;
  fitView();
}

/* ---------- Камера и отрисовка кадра ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let dpr=1,VW=0,VH=0;
let cam={x:0,y:0,z:1},dirty=true,fx=null,ghost=null,mode=null,hl=null,selEnt=null;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2.5);VW=cv.clientWidth;VH=cv.clientHeight;cv.width=VW*dpr;cv.height=VH*dpr;dirty=true}
addEventListener('resize',()=>{resize();clampCam()});
const topH=()=>$('top').offsetHeight,barH=()=>$('bar').offsetHeight;
function fitView(){
  resize();const availH=VH-topH()-barH();
  const me=S.ents.find(e=>e.owner===S.you&&e.kind==='hq');
  const fit=Math.min(VW/W,availH/H);
  if(me){cam.z=Math.max(fit,VW/(CELL*14));centerOn(me.x,me.y)}
  else{cam.z=fit;cam.x=(VW-W*cam.z)/2;cam.y=topH()+(availH-H*cam.z)/2}
  clampCam();
}
function centerOn(x,y){cam.x=VW/2-(x+.5)*CELL*cam.z;cam.y=topH()+(VH-topH()-barH())/2-(y+.5)*CELL*cam.z}
function clampCam(){
  const t=topH(),b=barH(),sw=W*cam.z,sh=H*cam.z;
  cam.x=sw<=VW?(VW-sw)/2:Math.min(40,Math.max(VW-sw-40,cam.x));
  const av=VH-t-b;cam.y=sh<=av?t+(av-sh)/2:Math.min(t+40,Math.max(VH-b-sh-40,cam.y));
  dirty=true;
}
function frame(now){
  requestAnimationFrame(frame);
  if($('game').style.display==='none'||!base)return;
  if(fx){dirty=true}
  if(!dirty)return;dirty=false;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // тёмный стол за листом
  ctx.fillStyle='#3a2c20';ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.translate(cam.x,cam.y);ctx.scale(cam.z,cam.z);
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=18;ctx.shadowOffsetY=5;
  ctx.fillStyle='#f4edda';ctx.fillRect(0,0,W,H);ctx.shadowColor='transparent';
  ctx.imageSmoothingEnabled=true;ctx.drawImage(base,0,0);
  ctx.globalCompositeOperation='multiply';ctx.drawImage(ink,0,0);ctx.globalCompositeOperation='source-over';
  drawOverlays(now);
  ctx.restore();
}
requestAnimationFrame(frame);
function drawOverlays(now){
  const r=rngOf(9);
  if(hl){
    // клетки подсвечены штриховкой простого карандаша
    ctx.lineWidth=1.3/ Math.sqrt(cam.z);
    if(hl.cells){
      ctx.strokeStyle=hl.color||'rgba(40,100,60,.6)';ctx.fillStyle=hl.fill||'rgba(50,140,80,.13)';

  const h=document.createElement('h2');P.append(h);
  const me=S.players[S.you],canBuild=S.ents.some(e=>e.owner===S.you&&e.kind==='hq');
  const pick=k=>()=>{if(!myTurn())return toast('Сейчас не ваш ход');if(S.built)return toast('Постройка за этот ход уже сделана');startBuild(k)};
  const can=c=>Object.entries(c).every(([r,v])=>me.res&&me.res[r]>=v);
  const reqNote=s=>s.req&&!S.ents.some(e=>e.owner===S.you&&e.kind===s.req)?` · нужен: ${specOf(s.req).name}`:'';
  const costs=(k,s)=>{const c=Object.assign({},s.cost);if(s.grp==='inf'&&me.techs.includes('cheap')&&c.zakup)c.zakup=Math.max(1,c.zakup-1);return c};
  const costStr=c=>Object.keys(c).length?costText(c):'бесплатно';
  if(panelName==='build'){
    h.textContent='Строительство';
    if(!canBuild){const p=document.createElement('p');p.textContent='Ваш штаб разрушен: строить больше нельзя, но войска всё ещё могут сражаться.';P.append(p);return}
    const grp=[['Основа',['extractor','barracks','tankworks','artworks','docks','airfield','refinery','trade']],['Электричество',['pole','aes','hes','battery']],['Оборона',['wall','wire','cannon','defhq','dot','aa','gate','dwall','ladder']],['Штабы и техника',['tactical','radar','space','dropc']],['Подводные постройки',['milhq','ubunker','hatch','pump','helipad','launcher']]];
    P.append(card('road','бесплатно · 2 см (4 клетки) · к ресурсам для добычи',pick('road')));
    for(const [title,list] of grp){const c=document.createElement('h3');c.textContent=title;P.append(c);
      for(const k of list){const s=specOf(k);P.append(card(k,`${costStr(costs(k,s))} · ${s.desc||''}${reqNote(s)}`,pick(k),can(s.cost)))}}
    const c=document.createElement('h3');c.textContent='Исследования';P.append(c);
    for(const k of Object.keys(META.techs)){const s=META.techs[k],done=me.techs.includes(k);
      const b=document.createElement('button');b.className='card'+(done||!can(s.cost)?' no':'');
      const t=document.createElement('div'),hh=document.createElement('b');hh.textContent=s.name+(done?' ✓':'');const m=document.createElement('small');m.textContent=`${costText(s.cost)} · ${s.desc}`+(s.bld?` · нужна ${specOf(s.bld).name}`:'');t.append(hh,m);b.append(t);
      b.onclick=()=>{if(done)return;if(!myTurn())return toast('Сейчас не ваш ход');act({type:'research',tech:k}).then(closePanel).catch(()=>{})};P.append(b)}
  }else if(panelName==='sheet'){
    h.textContent='Лист государства: '+me.name;
    const t=document.createElement('table'),pts=S.points||{};
    t.innerHTML='<tr><th>Ресурс</th><th>Точки</th><th>В казне</th></tr>';
    for(const k of ['iron','titan','oil','gold','stone','rock','gas','zakup']){const r=document.createElement('tr');for(const v of [META.res[k],'•'.repeat(Math.min(pts[k]||0,20))+(pts[k]>20?'…':''),me.res?me.res[k]:0]){const d=document.createElement('td');d.textContent=v;r.append(d)}t.append(r)}
    P.append(t);
    const n=document.createElement('p');n.className='note';const ev=S.taxEvery||10,left=ev-((S.round||0)%ev);
    n.textContent=`Каждые ${ev} раундов каждая точка превращается в 1 единицу ресурса. До подсчёта: ${left}. Точки дают добытчики, соединённые дорогой со штабом, и бензиновые заводы. Электричество: нужно ${S.power?S.power.demand:0}, есть ${S.power?S.power.supply:0}.`;P.append(n);
    addMarket(P,me);
  }else if(panelName==='army'){
    h.textContent='Войска';
    if(canBuild){const c=document.createElement('p');c.className='note';c.textContent='Новый отряд появляется рядом со своим зданием и считается постройкой хода. За ход можно управлять 3 самолётами, 3 единицами техники и 3 солдатами.';P.append(c);
    const titles={barracks:'Казарма',tankworks:'Танковый завод',artworks:'Завод артиллерии',airfield:'Аэродром',helipad:'Взлётная площадка',docks:'Доки',pluton:'Авианосец «Плотон»'};
    for(const src of Object.keys(titles)){const has=S.ents.some(e=>e.owner===S.you&&e.kind===src);const t=document.createElement('h3');t.textContent=titles[src]+(has?'':' (не построено)');P.append(t);
      for(const k of Object.keys(META.units)){const s=META.units[k];if(s.src!==src)continue;
        P.append(card(k,`${costStr(costs(k,s))} · HP ${s.hp}, урон ${s.onlyAir?'сбивает самолёт':s.bomb?'уничтожает здание':s.atk||'нет'}, даль. ${s.rng||'нет'}, ход ${s.mv*(S.speed||1)}${s.carry?' · перевозит':''}${reqNote(s)}`,pick(k),has&&can(costs(k,s))))}}}
    const units=S.ents.filter(e=>e.owner===S.you&&META.units[e.kind]);
    const c2=document.createElement('h3');c2.textContent=`На карте: ${units.length}`;P.append(c2);
    for(const e of units){P.append(card(e.kind,META.units[e.kind].dom==='static'?'неподвижная постройка':`здоровье ${e.hp}/${e.maxhp}`,()=>{closePanel();centerOn(e.x,e.y);clampCam();selectUnit(e)}))}
  }else if(panelName==='diplo'){
    h.textContent='Союзы и обмен';
    S.players.forEach((p,i)=>{
      if(i===S.you)return;
      const d=document.createElement('div');d.className='item';const dot=document.createElement('span');dot.className='dot';dot.style.background=p.color;
      const n=document.createElement('div');n.className='grow';n.textContent=p.name;const sm=document.createElement('small');
      const al=S.alliances.some(a=>a[0]===Math.min(i,S.you)&&a[1]===Math.max(i,S.you)),inc=S.proposals.some(x=>x[0]===i&&x[1]===S.you),out=S.proposals.some(x=>x[0]===S.you&&x[1]===i);
      sm.textContent=!p.alive?'выбыл':al?'союзник':inc?'предлагает союз!':out?'предложение отправлено':(p.online?'в сети':'не в сети');n.append(sm);d.append(dot,n);
      const a=(type,extra)=>act(Object.assign({type,to:i},extra)).catch(()=>{});
      if(p.alive&&me.alive&&S.status==='play'){
        const b=document.createElement('button');b.className='btn '+(al?'red':inc?'fill':'');b.textContent=al?'Разорвать':inc?'Принять':'Союз';b.disabled=out&&!al;
        b.onclick=()=>a(al?'ally_break':inc?'ally_accept':'ally_propose');d.append(b);
      }
      P.append(d);
      const hasTrade=S.ents.some(e=>e.owner===S.you&&e.kind==='trade');
      if((al||hasTrade)&&p.alive&&me.alive){
        const row=document.createElement('div');row.className='row';row.style.margin='6px 0 12px';
        const sel=document.createElement('select');for(const k of Object.keys(META.res)){const o=document.createElement('option');o.value=k;o.textContent=`${META.res[k]} (${me.res[k]})`;sel.append(o)}
        const num=document.createElement('input');num.type='text';num.inputMode='numeric';num.className='num';num.value='1';
        const send=document.createElement('button');send.className='btn';send.textContent='Дать';
        send.onclick=()=>{const v=parseInt(num.value);if(!(v>0))return;act({type:'give_res',to:i,res:sel.value,n:v}).then(()=>toast('Передано')).catch(()=>{})};
        row.append(sel,num,send);P.append(row);
        if(al&&p.res){const sm2=document.createElement('p');sm2.className='note';sm2.textContent='Склад союзника: '+Object.keys(META.res).map(k=>`${META.res[k]} ${p.res[k]}`).join(', ')+'. Войска и здания передаются при касании объекта на карте.';P.append(sm2)}
      }
    });
    if(me.alive&&S.status==='play'){const b=document.createElement('button');b.className='btn red wide';b.textContent='Сдаться';b.style.marginTop='14px';b.onclick=()=>{closePanel();setHint('Точно сдаться?',[['Да',()=>act({type:'surrender'}).then(clearMode).catch(()=>{}),'red'],['Нет',clearMode,'pencil']])};P.append(b)}
  }else if(panelName==='log'){
    h.textContent='Журнал и чат';
    const row=document.createElement('div');row.className='row';const inp=document.createElement('input');inp.type='text';inp.placeholder='Сообщение…';inp.maxLength=200;
    const sb=document.createElement('button');sb.className='btn';sb.textContent='→';const send=()=>{const v=inp.value.trim();if(!v)return;inp.value='';act({type:'chat',text:v}).catch(()=>{})};sb.onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send()};row.append(inp,sb);P.append(row);
    const box=document.createElement('div');box.id='logbox';box.style.marginTop='8px';
    for(const l of S.log.slice().reverse()){const d=document.createElement('div');d.className='l';if(l.who!=null&&S.players[l.who])d.style.color=S.players[l.who].color;d.textContent=(l.kind==='chat'?S.players[l.who].name+': ':'')+l.t;box.append(d)}
    P.append(box);
    const rb=document.createElement('button');rb.className='btn pencil wide';rb.style.marginTop='10px';rb.textContent='Правила';rb.onclick=showRules;P.append(rb);
    const ex=document.createElement('button');ex.className='btn red wide';ex.textContent=sess.host?'Отменить игру для всех':'Покинуть партию';ex.onclick=()=>{closePanel();askCancel()};P.append(ex);
  }
}
function addMarket(P,me){
  const c=document.createElement('h3');c.textContent='Рынок (не тратит ход)';P.append(c);
  const row=document.createElement('div');row.className='row';
  const sel=document.createElement('select');for(const k of Object.keys(META.res)){if(k==='zakup')continue;const o=document.createElement('option');o.value=k;o.textContent=`${META.res[k]}: прод. ${META.sell[k]||'—'}/куп. ${META.buy[k]||'—'}`;sel.append(o)}
  const num=document.createElement('input');num.type='text';num.inputMode='numeric';num.className='num';num.value='1';row.append(sel,num);P.append(row);
  const r2=document.createElement('div');r2.className='row';r2.style.marginTop='6px';
  for(const [lab,dir] of [['Продать','sell'],['Купить','buy']]){const b=document.createElement('button');b.className='btn grow';b.textContent=lab;b.onclick=()=>{const v=parseInt(num.value);if(!(v>0))return;act({type:'trade',res:sel.value,n:v,dir}).then(()=>{toast('Готово')}).catch(()=>{})};r2.append(b)}
  P.append(r2);
}
function showOver(){
  const w=S.winners||[];const box=$('over');box.style.display='flex';
  $('ot').textContent=w.includes(S.you)?'Победа!':'Поражение';
  $('om').textContent=w.length?'Победители: '+w.map(i=>S.players[i].name).join(', '):'Победителей нет';
}
$('oh').onclick=()=>{$('over').style.display='none';leaveToHome()};
$('ol').onclick=()=>{$('over').style.display='none'};

/* ---------- Правила ---------- */
function showRules(){
  const b=$('rules');b.style.display='block';
  const u=Object.values(META.units).map(s=>`<tr><td>${s.name}</td><td>${s.hp}</td><td>${s.onlyAir?'сбив.':s.bomb?'здание':s.atk||'—'}</td><td>${s.rng||'—'}</td><td>${s.mv}</td><td>${Object.keys(s.cost).map(k=>(k==='zakup'?'₽':META.res[k]+' ')+s.cost[k]).join(', ')}</td></tr>`).join('');
  b.innerHTML=`<div class="col"><button class="btn pencil wide" id="rc2">Закрыть</button><h1>Правила</h1>
  <h3>Начало</h3><p>Генерируется карта с реками, ресурсы стоят зеркально, чтобы было честно. Игроки по очереди ставят главный штаб, рядом появляются 2 отряда мотострелков.</p>
  <h3>Ход</h3><p>За ход можно сделать ОДНУ постройку (здание, отряд, дорогу, этап или исследование) и управлять войсками: 3 самолёта, 3 единицы техники и 3 солдата. Каждый выбранный юнит может один раз пойти и один раз атаковать. Дальность — это атака, скорость — это ход. Корабли и пушки считаются техникой, вертолёты — самолётами. Ход заканчивается кнопкой «Конец хода». Рынок, союзы, передача, снос и чат хода не тратят.</p>
  <h3>Ресурсы</h3><p>На карте на каждого игрока ровно 7 железа, 5 титана, 4 нефти, 2 золота, 7 стройматериалов и 4 камня. С начала игры у вас по одной точке железа, титана, нефти, стройматериалов и закупов. Подведите дорогу к месторождению и поставьте добытчика: это +1 точка. Каждые ${S&&S.taxEvery||10} раундов (меняется в лобби) каждая точка превращается в 1 единицу. Бензиновый завод даёт точку бензина, заводов не больше, чем точек нефти. Бензин продаётся за 4 закупа.</p>
  <h3>Здания</h3><p>У зданий нет прочности: их ломают с одного удара те, кому это разрешено: штурмовик, бомбардировщики, вертолёт «Василиск», «Вассал», ракета «Скарфогната», подрывник и пушки. Исключения: прочность АЭС 30, ГЭС 40. Бомбардировщиков на них нужно столько, сколько клеток занимает здание: на АЭС 4. Остальные снимают прочность своим уроном. Штаб, АЭС, тактический штаб и штаб разработок занимают 2×2 клетки. Коснитесь своего здания, чтобы снести его. Уничтоженные юниты исчезают.</p>
  <h3>Поражение</h3><p>Штаб разрушен — строить нельзя, но можно воевать. Нет юнитов — игрок выбывает, все его ресурсы получает уничтоживший. Побеждает последний игрок или союз.</p>
  <h3>Электричество</h3><p>АЭС строится по этапам и даёт 5 тока. ГЭС ставится на реку, а улучшения добавляются нажатием на неё: блок — 1 железо, слив — 2 закупа за блок, датчик — 1 железо, трансформатор — 1 титан и 2 железа, не больше 4. 1 блок со сливом = 1 ток, один трансформатор тянет 2 блока, поэтому чем длиннее ГЭС, тем больше энергии. К зданиям со значком тока ведите ЛЭП по 1 клетке за ход. С запитанной космической станцией ток можно передать без проводов кнопкой в самом здании. При взрыве АЭС всё в радиусе 3 см гибнет, зону закрывает только саркофаг: 13 стройматериалов до взрыва, 52 после.</p>
  <h3>Война</h3><p>Река непроходима без бродов и ГЭС-моста. Проволока держит пехоту и пушки. Подрывник гибнет при взрыве. По самолётам бьют ЗРК и истребители, подводные цели поражают только торпеды и подлодки. ДОТ можно обстрелять издали только после его выстрела. Нельзя строить ближе 6 клеток от чужих войск.</p>
  <h3>Юниты</h3><table><tr><th>Кто</th><th>HP</th><th>Урон</th><th>Дальн.</th><th>Ход</th><th>Цена</th></tr>${u}</table>
  <h3>Союзы и торговля</h3><p>Союзники не атакуют друг друга и передают ресурсы, здания и юнитов (кроме штаба). С торговым центром ресурсы можно дарить любому государству.</p>
  </div>`;
  $('rc2').onclick=()=>b.style.display='none';
}
document.querySelectorAll('[data-rules]').forEach(b=>b.onclick=showRules);

/* ---------- Старт ---------- */
(async function(){
  $('nm').value=store.get('name')||'';
  try{META=await api('/api/meta')}catch(e){toast('Сервер недоступен')}
  try{const s=JSON.parse(store.get('sess')||'null');if(s&&s.token){sess=s}}catch(e){}
  await atlasReady;
  show('home');
  const param=new URLSearchParams(location.search).get('room');
  if(sess)poll();
  else if(param)$('jc').value=param;
    resize();
})();
</script>
